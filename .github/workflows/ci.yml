name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Cache DejaVu Sans font
        # The homoglyph poisoning test downloads DejaVu Sans from
        # sourceforge once on first use; cache it across CI runs so
        # we don't bounce off a flaky mirror every build. The font
        # lives under platformdirs.user_cache_dir on Linux, which is
        # ~/.cache/pdf-plaintext-extraction/fonts.
        uses: actions/cache@v4
        with:
          path: ~/.cache/pdf-plaintext-extraction/fonts
          key: dejavu-sans-2.37

      - name: Install dependencies
        run: uv sync

      - name: Pre-fetch DejaVu Sans (if not cached)
        run: |
          uv run python -c \
            "from pdf_plaintext_extraction.synthesize._fonts import ensure_dejavu_sans; print(ensure_dejavu_sans())"

      - name: Run tests
        run: uv run pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Ruff check
        run: uv tool run ruff check pdf_plaintext_extraction tests

      - name: Ruff format check
        run: uv tool run ruff format --check pdf_plaintext_extraction tests
